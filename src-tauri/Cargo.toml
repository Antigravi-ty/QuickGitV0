[package]
name = "quick-git-v0"
version = "0.1.0"
description = "Lightweight Git Topology Inspector and Submodule State Switcher"
edition = "2021"

[lib]
name = "quick_git_v0_lib"
crate-type = ["rlib"]

[features]
default = ["devtools"]
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.dev]
debug = 1
incremental = true

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
